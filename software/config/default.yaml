serial:
  logs:                     # UART0: ESP debug log, receive only
    port: /dev/ttyAMA0
  comms:                    # UART1: command/reply link
    port: /dev/ttyAMA2
  baudrate: 115200
  reply_timeout_s: 0.5      # how long to wait for the ESP's reply to one command
  trigger_timeout_s: 2.0
  poll_hz: 10.0             # how often the axis positions are read
  reconnect_s: 2.0          # retry period when a port cannot be opened
  esp_log_file: logs/esp_debug.log

camera:
  index: 0
  width: 640
  height: 480
  fps: 30
  retry_s: 2.0

control:
  pan_axis_id: 0
  tilt_axis_id: 1
  hfov_deg: 62.0             # camera horizontal field of view
  invert_pan: false
  invert_tilt: false
  gain: 0.7                  # fraction of the angle error corrected per command
  deadband_deg: 0.3
  lead_time_s: 0.12          # predict this far ahead to cover camera + motor delay
  move_rate_hz: 20.0
  pan_min_deg: -90.0
  pan_max_deg: 90.0
  tilt_min_deg: -20.0
  tilt_max_deg: 45.0
  fire_tolerance_deg: 1.0
  fire_stable_frames: 3      # consecutive frames on target before firing
  fire_cooldown_s: 0.5
  position_max_age_s: 1.0    # do not aim from an ESP position older than this

ui:
  host: 127.0.0.1            # keep on loopback and use an SSH tunnel
  port: 8000
  jpeg_quality: 70
  stream_fps: 20.0
  log_lines: 300