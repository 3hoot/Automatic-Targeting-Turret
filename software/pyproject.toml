[build-system]
requires = ["setuptools==75.6.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "turret"
version = "0.1.0"
description = "Turret control for Raspberry Pi 5 + ESP32-S3"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "pyserial",
    "PyYAML",
    "fastapi",
    "uvicorn",
    "typer",
]

[project.scripts]
turret = "turret.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
exclude = [
    ".venv",
    "unused"
]